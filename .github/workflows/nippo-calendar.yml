name: Nippo calendar (holidays & weather)
on:
  schedule:
    - cron: '17 21 * * *'   # 毎朝 6:17（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch holidays and weather
        run: python scripts/nippo_calendar.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/nippo-calendar.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "祝日・天気データを更新 [skip ci]"
          git pull --rebase origin main
          git push
