name: Tokyo events (events & cruises)
on:
  schedule:
    - cron: '43 20 * * *'   # 毎朝 5:43（日本時間）
    - cron: '43 8 * * *'    # 毎夕 17:43（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect events
        run: python scripts/tokyo_events.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/tokyo-events.json data/tokyo-events-archive.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "東京イベント情報を更新 [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
