<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>o-utのなんちゃって株式解析</title>
<meta name="description" content="自分用の株の動向チェック：毎朝自動更新のチャートとニュースまとめ">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="o-utのなんちゃって株式解析">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./logo-mark.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="./logo-mark.png" alt="" width="30" height="30">o-utのなんちゃって株式解析</div>
  <div class="stamp" id="stamp">読み込み中</div>
</header>

<main>
  <section id="tab-today" class="tab is-active" aria-labelledby="t-today">
    <h1 id="t-today" class="sr">注目</h1>
    <div id="today"></div>
  </section>

  <section id="tab-search" class="tab" aria-labelledby="t-search">
    <h1 id="t-search" class="page-title">銘柄を探す</h1>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="会社名・読み・コード（例：みつびし、トヨタ、apple、7203）" aria-label="会社名または銘柄コード">
    </div>
    <p class="hint" id="searchHint">東証と米国の全上場銘柄から探せます。ひらがな・カタカナ・漢字・ローマ字・英字・コードのどれでも、打つたびに候補を予測します。</p>
    <ul id="results" class="list"></ul>
  </section>

  <section id="tab-hold" class="tab" aria-labelledby="t-hold">
    <h1 id="t-hold" class="page-title">保有株</h1>
    <div id="hold"></div>
  </section>

  <section id="tab-interest" class="tab" aria-labelledby="t-interest">
    <h1 id="t-interest" class="page-title">気になる</h1>
    <div id="interest"></div>
  </section>

  <section id="tab-settings" class="tab" aria-labelledby="t-settings">
    <h1 id="t-settings" class="page-title">設定</h1>
    <div id="settings"></div>
  </section>
</main>

<div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
  <div class="detail-bar">
    <button class="back" id="back" aria-label="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>戻る</button>
    <button class="star" id="star" aria-pressed="false">☆ 気になる</button>
  </div>
  <div id="detailBody"></div>
</div>

<nav class="tabs" aria-label="画面の切り替え">
  <button data-tab="today" class="is-active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 9 12l4 3 7-9"/><path d="M15 6h5v5"/></svg>注目</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>探す</button>
  <button data-tab="hold"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12h17"/></svg>保有株</button>
  <button data-tab="interest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></svg>気になる</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
</nav>
<script src="./search.js"></script>
<script src="./app.js"></script>
</body>
</html>
