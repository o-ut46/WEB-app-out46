<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Logic Pro 手引き</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Logic Pro 手引き">
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: 制作の流れをトラック領域に見立てたホームと、1カラムで読む章ページ。選択はすべてポップアップ。 */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunken:#E2E8E5; --line:#CBD5D1;
  --ink:#16211E; --muted:#54625E; --accent:#0A7263; --accent-ink:#FFFFFF;
  --rec:#C93528; --amber:#A86400; --lcd:#17211F; --lcd-ink:#8FE3D0;
  --r-audio:#2B8C7C; --r-midi:#5B8F2E; --r-pattern:#BC7A12; --r-player:#C2563B; --r-ink:#FFFFFF;
  --font:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --hw:128px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A18; --surface:#1D2523; --sunken:#0F1413; --line:#33403C;
  --ink:#E8EEEC; --muted:#A1AFAA; --accent:#55CDB8; --accent-ink:#0B1A17;
  --rec:#F0695B; --amber:#E9AE55; --lcd:#0B100F; --lcd-ink:#8FE3D0;
  --r-audio:#2F8F80; --r-midi:#5F9134; --r-pattern:#A86F14; --r-player:#B65239; --r-ink:#FFFFFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1D2523; --sunken:#0F1413; --line:#33403C;
  --ink:#E8EEEC; --muted:#A1AFAA; --accent:#55CDB8; --accent-ink:#0B1A17;
  --rec:#F0695B; --amber:#E9AE55; --lcd:#0B100F; --lcd-ink:#8FE3D0;
  --r-audio:#2F8F80; --r-midi:#5F9134; --r-pattern:#A86F14; --r-player:#B65239; --r-ink:#FFFFFF;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
html{font-size:var(--fs,100%)}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.75 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lcd)}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{line-height:1.35;font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* トランスポート風ヘッダー */
.top{font-size:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--lcd);color:#E8EEEC}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:9px}
.brand{display:flex;align-items:baseline;gap:8px;color:#E8EEEC;text-decoration:none;font-weight:700;font-size:1.02em;white-space:nowrap}
.brand i{font:500 .68em var(--mono);color:var(--lcd-ink);font-style:normal;letter-spacing:.06em}
.search{flex:1 1 220px;min-width:0;order:3}
.search input{width:100%;height:38px;border-radius:6px;border:1px solid #3B4A46;background:#222C2A;color:#E8EEEC;padding:0 12px;font:inherit;font-size:.95em}
.search input::placeholder{color:#9FB0AB}
.spacer{flex:1}
.ver{font:500 .75em var(--mono);color:var(--lcd-ink);border:1px solid #3B4A46;border-radius:4px;padding:1px 6px;white-space:nowrap}
.pop-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:6px;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500;max-width:100%;text-align:left}
.pop-btn::after{content:"";width:7px;height:7px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)}
.top .pop-btn{background:#222C2A;border-color:#3B4A46;color:#E8EEEC}
@media (min-width:760px){.search{order:0;max-width:420px}}
@media (max-width:759px){.search{flex-basis:100%}}
@media (max-width:520px){.brand i{display:none}.top-in{gap:8px 5px}.brand{font-size:.98em}.spacer{flex:1}.search{order:5;flex:1 1 220px}.ver{order:6}.top .pop-btn,.top .icon-btn{padding:0 8px}.ver{font-size:.68em;padding:1px 4px}}

main{padding-block:24px 56px}
.note{font-size:.84rem;color:var(--muted)}

/* ホーム:トラック領域 */
.hero{display:grid;gap:8px;margin-bottom:18px;max-width:46em}
.hero h1{font-size:clamp(1.45rem,4.2vw,2rem)}
.arr{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.ruler{display:flex;margin-left:var(--hw);height:24px;align-items:center;background:var(--sunken);font:500 .7rem var(--mono);color:var(--muted);border-bottom:1px solid var(--line)}
.ruler span{flex:1;padding-left:4px;border-left:1px solid var(--line);line-height:24px}
.lane{display:flex;align-items:stretch;min-height:50px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lane:last-of-type{border-bottom:0}
.lane:hover .thead{background:var(--sunken)}
.thead{width:var(--hw);flex:none;padding:6px 8px 6px 10px;border-right:1px solid var(--line);font-weight:700;font-size:.86rem;line-height:1.35;display:flex;align-items:center}
.track{flex:1;position:relative;min-width:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/8 - 1px),var(--sunken) calc(100%/8 - 1px) calc(100%/8))}
.region{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--c);color:var(--r-ink);padding:1px 6px;overflow:hidden;font-size:.72rem;font-weight:500;line-height:1.4;white-space:nowrap}
.region svg{position:absolute;left:0;right:0;bottom:1px;width:100%;height:55%;opacity:.55}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);left:calc(var(--hw) + (100% - var(--hw))*var(--p,0));transition:left .35s;pointer-events:none;z-index:2}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--rec)}
@media (prefers-reduced-motion:reduce){.playhead{transition:none}}
@media (max-width:520px){:root{--hw:96px}.thead{font-size:.78rem}}

.home-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:22px;align-items:start}
@media (max-width:820px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h2{font-size:1.08rem;margin-bottom:4px}
.check{list-style:none;display:grid;gap:2px;margin-top:10px}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.check label{flex:1;min-width:0}
.check a{font-size:.8rem;white-space:nowrap}
.check .done{color:var(--muted);text-decoration:line-through}
.quick{list-style:none;display:grid;gap:8px;margin-top:10px}
.quick a{display:block;text-decoration:none;color:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px}
.quick a:hover{border-color:var(--accent)}
.quick b{display:block;color:var(--accent);font-weight:700}
.quick small{color:var(--muted);font-size:.8rem;line-height:1.5;display:block}

/* 章ページ */
.ch-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.ch-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:start}
@media (max-width:900px){.ch-layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:76px;font-size:.84rem;line-height:1.5;border-left:2px solid var(--line);padding-left:12px;display:grid;gap:7px}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--accent)}
.page-title{font-size:clamp(1.4rem,4vw,1.8rem);margin:6px 0 4px}
.topic{padding-block:22px;border-top:1px solid var(--line);display:grid;gap:10px}
.topic:first-of-type{border-top:0}
.topic-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.topic h2{font-size:1.22rem}
.star{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.t-btns{display:flex;gap:6px;flex:none}
.say{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.say svg{width:18px;height:18px}
.say[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.topic.reading{background:linear-gradient(90deg,var(--sunken),transparent 85%);box-shadow:inset 3px 0 0 var(--accent);padding-left:12px;margin-left:-12px}
.ch-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:6px;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.icon-btn svg{width:16px;height:16px}
.top .icon-btn{background:#222C2A;border-color:#3B4A46;color:#E8EEEC;padding:0 10px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--lcd);color:#E8EEEC;padding-bottom:env(safe-area-inset-bottom,0px)}
.player-in{display:flex;align-items:center;gap:10px;padding-block:10px}
.player-txt{flex:1;min-width:0;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-txt i{font:500 .7rem var(--mono);color:var(--lcd-ink);font-style:normal;margin-right:8px}
.player button{min-height:36px;padding:0 12px;border-radius:6px;border:1px solid #3B4A46;background:#222C2A;color:#E8EEEC;cursor:pointer;font-weight:500;white-space:nowrap}
body.has-player main{padding-bottom:110px}
.steps{counter-reset:s;list-style:none;display:grid;gap:8px}
.steps li{counter-increment:s;position:relative;padding-left:34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--sunken);font:500 .78rem/24px var(--mono);text-align:center}
.dots{padding-left:1.2em;display:grid;gap:5px}
.tip{background:var(--sunken);border-radius:6px;padding:9px 12px;font-size:.92rem}
.tip b{color:var(--amber)}
.src{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font:500 .68rem var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.tag.old{color:var(--amber);border-color:var(--amber)}
.tag.ext{color:var(--r-player);border-color:var(--r-player)}
kbd{font:500 .84em var(--mono);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}
.tip kbd,.key-row kbd{background:var(--surface)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.pager a{padding:8px 12px;border:1px solid var(--line);border-radius:6px;text-decoration:none;font-weight:500}

/* キー一覧・用語など */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.toolbar input{flex:1 1 180px;min-width:0;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.key-group{margin-top:18px}
.key-group h2{font-size:.98rem;color:var(--muted);margin-bottom:4px}
.key-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 2px;border-top:1px solid var(--line);font-size:.94rem}
.key-row span{min-width:0}
.key-row .ks{flex:none;text-align:right}
.chg{font:500 .66rem var(--mono);color:var(--rec);margin-left:6px;white-space:nowrap}
.dl{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.dl>div{padding:11px 0;border-top:1px solid var(--line)}
.dl dt{font-weight:700}
.dl dd{margin:0;font-size:.95rem}
.card-list{display:grid;gap:12px;margin-top:12px}
.card-list>article{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:7px}
.card-list h2{font-size:1.04rem}
.result{display:block;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.result b{color:var(--accent)}
.result small{display:block;color:var(--muted);font-size:.85rem;line-height:1.55}
mark{background:var(--amber);color:var(--bg);border-radius:2px;padding:0 1px}
.empty{padding:24px 0;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-block:16px 28px;font-size:.8rem;color:var(--muted)}

/* チャンネルストリップ図とピアノロール図 */
.strip{list-style:none;display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.strip li{display:grid;grid-template-columns:minmax(0,132px) minmax(0,1fr);border-top:1px solid var(--line)}
.strip li:first-child{border-top:0}
.strip b{background:var(--lcd);color:#E8EEEC;font-size:.8rem;font-weight:500;line-height:1.4;padding:8px 10px;display:flex;align-items:center}
.strip span{padding:7px 12px;font-size:.92rem;line-height:1.6}
.fig{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.fig svg{display:block;width:100%;height:auto}
.fig text{font-family:var(--mono);fill:var(--muted);font-size:11px}
.fig .num{fill:var(--ink)}.fig .numt{fill:var(--bg);font-size:13px;font-weight:500;text-anchor:middle}
.fig .jp{font-family:var(--font);font-size:13px;fill:var(--ink)}
.fig .jps{font-family:var(--font);font-size:11.5px;fill:var(--muted)}
.fig .on{fill:var(--accent-ink);font-weight:700}
.fig-cap{font-size:.8rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);margin:0}
/* ポップアップ */
.pop-back{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45)}
.pop{position:fixed;z-index:41;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.28);overflow:auto;max-height:70vh;padding:6px;width:300px}
.pop h3{font-size:.76rem;color:var(--muted);padding:6px 10px 4px;font-weight:500}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:9px 10px;cursor:pointer;line-height:1.4}
.pop button:hover,.pop button:focus-visible{background:var(--sunken)}
.pop button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pop small{display:block;font-size:.76rem;opacity:.75}
@media (max-width:600px){.pop{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
</style>

<header class="top">
  <div class="wrap gutter top-in">
    <a class="brand" href="#home">Logic Pro 手引き <i>MAC 13.0</i></a>
    <div class="search"><input id="q" type="search" placeholder="機能名や困りごとで検索（例:遅延、ステム）" aria-label="手引き全体を検索"></div>
    <span class="spacer"></span>
    <button class="pop-btn" id="modeBtn" aria-haspopup="listbox">ホーム</button>

</header>

{id:'piano',name:'ピアノロール',color:'--r-player',lead:'MIDIのノートを書いて、動かして、強弱とタイミングを整えます。[[P]]で開きます。',topics:[
 {id:'pr-view',t:'開き方と画面の見方',p:'ソフトウェア音源トラックのMIDIリージョンをダブルクリックするか、リージョンを選んで[[P]]を押します。別ウインドウで開くキーは[[⌘4]]です。ノートは色付きの棒で、横が位置と長さ、縦が音程を表します。',fig:'proll',n:['インスペクタ:クオンタイズ、音程、ベロシティを調整','鍵盤:音程の目安。ドラムは「View」→「Drum Names」でドラム名に切り替えられる','メニューとルーラー:ツールやスナップを選び、小節位置を確認','ノート:リージョンの中身。図は強さで色分けした状態','オートメーション/MIDIエリア:ベロシティ線などを編集'],tip:'ヘッダのツールメニューの右に、ポインタの位置のノート名と時間位置が表示されます。音程に迷ったときはここを見ます。',s:['prv','keys']},
 {id:'proll',t:'ノートを書く',p:'まず入れ物になるMIDIリージョンが必要です。トラック領域で鉛筆ツールを使ってクリックすると作れます。',n:['リージョンをダブルクリックしてピアノロールを開く','ツールメニューで鉛筆ツールを選ぶ','置きたい位置をクリックする','そのままドラッグして長さを決める'],d:['背景を[[⌃クリック]]して「Create Note」でも追加できる','スナップを無視して正確な位置に置く:[[⌃⇧]]を押しながら鉛筆でクリック','ブラシツール:ドラッグでTime Quantizeの間隔に連続して追加。[[⇧]]で同じ音程に限定','ステップ入力:MIDI Inボタンをオンにして鍵盤で入力','Scale QuantizeとSnap to Scaleをオンにすると、スケールの音だけを置ける'],tip:'新しいノートは直前に作成か編集したノートの長さ、ベロシティ、チャンネルを引き継ぎます。新規プロジェクトの初期値は長さ240ティック、ベロシティ80です。',s:['piano','ragp']},
 {id:'pr-move',t:'選ぶ、動かす、複製する',p:'ノートはドラッグで動かします。移動量はスナップの設定に従います。',d:['複数選択:空白からドラッグ、または[[⇧]]を押しながらクリック','すべて選択:[[⌘A]]','同じ音程をまとめて選択:[[⇧]]を押しながら鍵盤をクリック','細かく移動:[[⌃]]を押しながらドラッグ','ティック単位で移動:[[⌃⇧]]を押しながらドラッグ','複製:[[⌥]]を押しながらドラッグ','半音ずつ移調:[[⌥↑]]/[[⌥↓]]、オクターブ:[[⌥⇧↑]]/[[⌥⇧↓]]','削除:[[⌫]]'],tip:'縦横に同時にずれて困るときは、「設定」→「一般」→「編集」の「Limit Dragging to One Direction In Piano Roll and Score」をオンにします。移調と複製のキーはRAG MusicとProMix Academyの解説によるもので、公式のキー一覧では確認していません。',s:['prm','prs','ragp','pma']},
 {id:'pr-len',t:'長さを変える',p:'ノートの左端か右端を横にドラッグします。短くてつかみにくいノートは、フィンガーツールならどこをつかんでも長さを変えられます。',d:['複数選択して端をドラッグ:長さの差を保ったまま変わる','[[⇧]]を押しながらドラッグ:選択ノートの終わりの位置をそろえる','[[⌥⇧]]を押しながらドラッグ:選択ノートの長さをそろえる','「Edit」→「Trim」:重なりの解消やレガートを実行','「Functions」→「Convert Sustain Pedal to Note Length」:ペダル情報をノートの長さに変換'],s:['prl','prs']},
 {id:'pr-vel',t:'強弱をつける(ベロシティ)',p:'ベロシティはノートを弾く強さで、0〜127の値です。全部同じ値だと機械的に聞こえやすいので、拍の強弱に合わせて変えます。',n:['ノートを選ぶ','[[⌃⌘]]を押しながらノートを上下にドラッグする(一時的にVelocityツールに切り替わる)','ヘルプタグの値を見ながら離す'],d:['ヘッダのベロシティスライダーでも変更できる。[[⇧]]で細かく調整','複数選択したままドラッグ:値の差を保って増減','Velocityツールで[[⌥⇧]]を押しながらドラッグ:同じ値にそろえる','「View」→「Set Note Color」→「By Velocity」:強さで色分け(高いほど暖色、低いほど寒色)','MIDI Inをオンにすると、鍵盤を弾いた強さを選択中のノートに適用できる'],s:['prb','prs','ragp']},
 {id:'pr-quant',t:'タイミングと音程をそろえる(クオンタイズ)',p:'タイミングのずれを音符の格子に合わせます。元の演奏データは残り、Time Quantizeを「オフ」にすれば戻せます。',n:['リージョンまたはノートを選ぶ','インスペクタのTime Quantizeで基準の音符を選ぶ(すぐ適用するキーは[[Q]])','Strengthで合わせる強さを調整する','Swingでハネの度合いを調整する'],d:['クオンタイズツール:ノートをクリックかドラッグして部分的に補正','解除:[[⌥⌘Q]]','音程をそろえる:ノートを選び、Scale Quantizeでスケールとキーを選ぶ'],tip:'Strengthを下げると、人の演奏の揺れを少し残したまま整えられます。',s:['prq','prc','keys','main']}
]},
{id:'expr',name:'演奏表現',color:'--rec',lead:'ハンマリング、プリング、スライド、チョーキングなど、弦楽器らしい表現をピアノロールで付けます。',topics:[
 {id:'ex-map',t:'3つのやり方と使い分け',p:'表現を付ける方法は、音源の種類によって3つに分かれます。',d:['奏法を切り替える:Studio Bassのように奏法の録音を持つ音源で使う。ハンマリング、プリング、スライド、デッドノート、ハーモニクスを本物の音で鳴らせる','ピッチベンドを描く:チョーキングやビブラートのような、音程がなめらかに動く表現。ほとんどの音源で使える','ノートを重ねてレガートにする:Alchemy、Sampler、Retro Synthなどのシンセで、弾き直さずに次の音へつなぐ'],tip:'録音済みのオーディオ(ギターの生演奏など)の音程を直すときは、ピアノロールではなくFlex Pitchを使います。',s:['sbo','pram','alc','flex']},
 {id:'ex-artic',t:'ノートごとに奏法を指定する',p:'打ち込みで奏法を付けるなら、この方法が確実です。ノート1つずつに奏法の番号(アーティキュレーションID)を持たせます。',n:['Studio Bassのパッチを読み込む(対応するアーティキュレーションセットも自動で入る)','ピアノロールで、奏法を付けたいノートを選ぶ','アーティキュレーションのポップアップメニューから奏法を選ぶ','または、ノートを[[⌃クリック]]して「アーティキュレーション」から選ぶ'],d:['ポインタをノートに合わせると、ヘルプタグで付いている奏法を確認できる','Studio Bassの奏法セットは、Finger、Pick、Slap、American Uprightの奏法ごとに分かれている'],tip:'ポップアップメニューが見えないときは、ピアノロールの画面を縦に広げます。トラックにアーティキュレーションセットがないとメニューは使えません。',s:['art','sbo']},
 {id:'ex-keysw',t:'キースイッチで奏法を切り替える',p:'楽器の音域より下にある鍵盤を押すと、そこから奏法が切り替わります。鍵盤で弾きながら切り替えるときに便利です。Studio Bassの割り当ては次のとおりです。',fig:'ks',rows:[['C-1','自動(All)'],['C#-1','指やピックの交互弾きを自動'],['D-1','人差し指だけ / ダウンだけ / スラップだけ'],['E♭-1','レガート(ハンマリング/プリング)'],['E-1','中指だけ / アップだけ / プルだけ'],['F-1','デッドノート'],['F#-1','デッドノート(Pickはハーモニクス)'],['G-1','ハーモニクス'],['G#-1','ピックアップを叩く音(1回)'],['A-1','スライド(Slide by Velocity)'],['B♭-1','ピックアップを叩く音(全部)'],['B-1','2半音下からのスライドイン(Slide In +2)']],tip:'ハンマリングとプリングは、別々のキーではなく「レガート」1つにまとめられています。公式の表には「HammerOn/PullOff」の表記しかないので、上がる音はハンマリング、下がる音はプリングとして鳴ると考えられますが、明記はされていません。Slide by Velocityの詳しい動きも公式には書かれていないので、耳で確かめてください。American Uprightでは一部の割り当てが異なります。',s:['sbk','sbo']},
 {id:'ex-bend',t:'ピッチベンドを描く(チョーキング、ビブラート)',p:'音程の動きをピアノロール下のレーンに線で描きます。',fig:'bend',n:['ピアノロールの「Show/Hide Automation」ボタンを押して、下にAutomation/MIDIエリアを出す','「Region」を選び、パラメータのメニューで「Pitch Bend」を選ぶ','鉛筆ツールでクリックやドラッグをして、カーブを描く','描いたポイントは、上下で値、左右で位置を調整する'],d:['値は0〜127で、64が音程の変化なし。上が音程が上がる側','どこまで上がるかは音源側の設定で決まる。Studio BassはDetails画面のPitchbend UpとDownで半音単位で設定する','全音のチョーキングにするなら、Upを2にして127まで描く','ビブラートは、64より少し上の山を細かく繰り返して描く'],tip:'描き終えたら、次の音の前で必ず64に戻します。戻し忘れると、後ろのノートの音程がずれたままになります。',s:['pram','autp','pbe','sbd']},
 {id:'ex-legato',t:'ノートを重ねてレガートやグライドにする',p:'シンセの音源では、ノートの重ね方でハンマリングやスライドのような効果を作れます。',fig:'legato',n:['音源のモードをLegatoにする(AlchemyはTrigger Mode、SamplerはMode)','Glide(ポルタメント)の時間を設定する','ピアノロールで、前の音の終わりと次の音の頭を少しだけ重ねる'],d:['重なった部分だけ、弾き直さずに次の音程へつながる','Glideを長めにするとスライド、ごく短くするとハンマリングやプリングに近い感じになる','重ならないノートは、普通に弾き直した音になる','Samplerは、Monoモードにすると重ねなくても毎回グライドする','Studio BassにもPortamento(音と音の間をスライドする時間)のノブがある'],tip:'ノートの長さをそろえて少しずつ重ねたいときは、ピアノロールの「Edit」→「Trim」にあるレガートの機能が使えます。',s:['alc','smp','sbd','prl']},
 {id:'ex-guitar',t:'ギターの音源で表現を付けるには',p:'Logic Proの付属音源には、ギターの奏法をキースイッチで切り替えられる専用音源は見当たりませんでした。今回、公式に奏法の割り当てを確認できたのはStudio Bassだけです。',d:['付属のギター系の音色:ピッチベンドとレガートの方法で表現を付ける','他社のギター音源:キースイッチの位置は製品ごとに違うので、その音源の説明書で確認する','Samplerで自作する場合:グループにアーティキュレーションIDを割り当てると、スライドなどの録音を番号で切り替えられる'],s:['sart','sbo']}
]},
{id:'mix',name:'ミキサー',color:'--r-audio',lead:'[[X]]でミキサーを開き、バランス、空間、動きを作ります。',topics:[
 {id:'mx-view',t:'ミキサーの開き方と表示の切り替え',p:'トラック領域の下に開くなら[[X]]、別ウインドウなら[[⌘2]]です。別ウインドウのミキサーは複数開けて、それぞれ別の表示にできます。',d:['Single:選択中のトラックを中心に見る','Tracks:トラック領域にあるトラックを見る','All:プロジェクト内のすべてのチャンネルストリップを見る','表示モードの切り替え:[[⇧X]]','フィルターボタン:オーディオや音源など、種類を絞って表示','Track Stack:ストリップ下部の開閉矢印で中身を表示'],tip:'AuxとOutputにはトラックがありません。動きを書き込みたいときは、ミキサーの「Options」メニューからトラックを作れます。',s:['mxo','mxi']},
 {id:'mx-strip',t:'チャンネルストリップの見方(上から順に)',p:'ミキサーの縦一列が1チャンネルです。ソフトウェア音源とオーディオで一部の表示が異なります。',rows:[['設定','プラグインを含むルーティング全体を読み込み、保存'],['ゲインリダクション','最初のCompressorなどがどれだけ音量を下げたかを表示'],['EQ表示','クリックでChannel EQを追加または開閉'],['MIDIエフェクト','音源に届く前のMIDIを加工(音源トラック)'],['入力 / 音源','オーディオは入力チャンネル、音源トラックは音源プラグインを選ぶ'],['オーディオエフェクト','EQやコンプなどのインサート'],['チャンネルモード','モノラルとステレオを切り替え'],['センド','音の一部をAuxへ送る。ノブで量を調整'],['出力','音の出力先。通常はStereo Out'],['グループ','グループに割り当てて一緒に操作'],['オートメーション','Read、Touchなどのモードを選ぶ'],['パン / バランス','左右の位置を決める'],['VCA','VCAグループに割り当てる'],['ピーク表示','再生中の最大レベル。クリックでリセット'],['フェーダー','再生音量。値をダブルクリックして数値で入力'],['レベルメーター','信号の大きさ。赤はクリップ'],['R / I','録音可能と入力モニタのボタン'],['M / S','ミュートとソロ'],['トラック名','ダブルクリックで名前を変更']],tip:'対応するオーディオインターフェイスでは、さらに入力ゲインやファントム電源などが上部に表示されます。録音に使うマイクのファントム電源は、ここでも切り替えられます。',s:['mxs']},
 {id:'balance',t:'音量とパンを整える',p:'公式の説明では、次の順に進め、途中で行き来しながら仕上げます。',n:['フェーダーで各パートの音量バランスを取る','パンで左右の位置を決める','プラグインを追加して音色を整える','センドやバスで信号の流れを整える','オートメーションで曲中の変化を付ける'],d:['ソロで1本だけ聴く:[[S]]、ミュート:[[M]]','ピーク表示が赤い:0 dBを超えてクリップしている。フェーダーかプラグインの出力を下げる','ピーク表示がオレンジ:0 dBを超えているがクリップはしていない','ピーク表示はクリックで全チャンネルをリセットできる'],s:['mxo','mxs','keys']},
 {id:'mx-plug',t:'プラグインを入れる、動かす、外す',p:'エフェクトはオーディオエフェクトのスロットをクリックし、メニューから選びます。',d:['置き換え:スロットにポインタを合わせ、右の矢印から別のものを選ぶ','すばやく削除:[[⌘]]を押しながらスロットをクリック','順番の変更や別トラックへの移動:ドラッグ','コピー:[[⌥]]を押しながら空きスロットへドラッグ','一時的にオフ(バイパス):[[⌥]]を押しながらスロットをクリック','まとめてバイパス:スロットをクリックしたまま上下にドラッグ','EQを最初のスロットに入れる:EQ表示を[[⌥]]クリック'],tip:'バイパス中のプラグインは処理の負荷がかかりません。音を比べるときは削除せずにバイパスします。',s:['mxp','mxs']},
 {id:'mx-group',t:'複数のチャンネルをまとめて動かす',p:'ドラムなどをひとまとめに操作する方法です。',d:['グループ:グループスロットで割り当てると、1本のフェーダーを動かしたときに他も連動する。連動させる項目はグループ設定で選ぶ','VCA:ミキサーの「Options」→「Create New VCA for Selected Channel Strips」で作成','VCAへの割り当て:各ストリップのVCAスロットで選ぶ。解除は「No VCA」','バス:出力スロットで「Bus」を選ぶと、パートごとに処理してからまとめられる'],tip:'VCAは出力先が違うチャンネルもまとめられ、Auxをマスターにするより処理が軽くなります。フェーダー後のセンドは、VCAの音量に合わせて送り量も変わります。',s:['mxs','vca','ragm']},
 {id:'mx-save',t:'設定を保存して別の曲で使う',p:'チャンネルストリップ上部の設定ボタンから、プラグインを含む設定を保存して読み込めます。',d:['気に入ったボーカルやギターの設定を保存しておくと、次の曲ですぐに呼び出せる','保存されるのはルーティングとプラグインで、オートメーションは含まれない'],s:['mxs','ragm']},
 {id:'sends',t:'リバーブをセンドで共有する',p:'リバーブなどを1つのAuxに入れ、複数のトラックから送ると、響きが揃います。',n:['チャンネルストリップのSendスロットをクリックする','使っていないバスを選ぶ(送り先のAuxができる)','Auxにリバーブなどのプラグインを入れる','Sendノブで送る量を決める'],d:['Post Pan:音量とパンの影響を受ける','Post Fader:音量の影響だけ受ける','Pre Fader:音量もパンも影響しない','1チャンネルにつきセンドは最大8つ','Sendスロットを[[⇧]]クリックすると、送り先のAuxが点滅して場所を確認できる'],tip:'出典は10.7版のガイドです。13.0で表示が変わっている可能性があります。',s:['send','ragm']},
 {id:'autom',t:'曲の途中で音量や効果を動かす(オートメーション)',p:'[[A]]でオートメーションを表示します。トラックのモードで動作が変わります。',d:['Read:書いた通りに再生するだけ','Touch:触っている間だけ書き換え、離すと元に戻る','Latch:離した後もその値で書き換え続ける','Write:再生ヘッドが通った部分を消して書き込む(何もしなければ消える)','Trim:既存のカーブを全体的に上下させる(TouchかLatchと併用)'],tip:'Writeは操作しなくてもデータを消します。普段はTouchかLatchが安全です。全トラックをReadに戻すキーは[[⌃⇧⌘R]]です。',s:['auto','keys','main']},
 {id:'plug',t:'付属プラグインの地図',p:'公式ガイドの分類に沿って、主なものを挙げます。プラグインウインドウの一括開閉は[[V]]です。',d:['EQ:Channel EQ、Linear Phase EQ、Match EQ、Vintage EQ','ダイナミクス:Compressor、Limiter、Adaptive Limiter、Multipressor、Noise Gate、DeEsser 2','リバーブ:ChromaVerb、Space Designer、Quantec Room Simulator','ディレイ:Delay Designer、Stereo Delay、Tape Delay','ひずみ:ChromaGlow、Overdrive、Distortion、Bitcrusher','ギターとベース:Amp Designer、Bass Amp Designer、Pedalboard','ピッチ:Pitch Correction、Vocal Transformer','音源:Alchemy、Sampler、Quick Sampler、Sample Alchemy、Studio Piano、Studio Bass、Drum Kit Designer、Drum Machine Designer'],s:['toc','keys']}
]},

function topicHtml(t){
 const on=favs.includes(t.id);
 return `<section class="topic" id="t-${t.id}"><div class="topic-h"><h2>${fmt(t.t)}</h2><span class="t-btns"><button class="say" data-say="${t.id}" aria-pressed="false" aria-label="この項目を読み上げ" title="読み上げ">${SPK}</button><button class="star" data-star="${t.id}" aria-pressed="${on}" aria-label="お気に入り">${on?'★':'☆'}</button></span></div><p>${fmt(t.p)}</p>
 ${t.fig?({proll:prollFig,ks:ksFig,bend:bendFig,legato:legatoFig}[t.fig])():''}
 ${t.rows?'<ol class="strip">'+t.rows.map(r=>`<li><b>${esc(r[0])}</b><span>${fmt(r[1])}</span></li>`).join('')+'</ol>':''}
 ${t.n?'<ol class="steps">'+t.n.map(x=>`<li>${fmt(x)}</li>`).join('')+'</ol>':''}
 ${t.d?'<ul class="dots">'+t.d.map(x=>`<li>${fmt(x)}</li>`).join('')+'</ul>':''}

/* ピッチベンド:上がノート、下がベンドのレーン */
function bendFig(){
 const L=60,R=620,T=14,nh=18,lane0=96,lane1=196,mid=(lane0+lane1)/2;
 const X=b=>L+(R-L)*b/8,Y=v=>lane1-(lane1-lane0)*v/127;
 let s=`<rect x="${L}" y="${T}" width="${R-L}" height="${nh*3}" fill="var(--sunken)"/>`;
 for(let i=0;i<=8;i++)s+=`<line x1="${X(i)}" y1="${T}" x2="${X(i)}" y2="${lane1}" stroke="var(--line)" stroke-width="${i%2?0.5:1}"/>`;
 [[0,1.6,1],[2,3.2,1],[5.6,7.6,2]].forEach(n=>s+=`<rect x="${X(n[0])+1}" y="${T+n[2]*nh+1}" width="${X(n[1])-X(n[0])-2}" height="${nh-2}" rx="2" fill="var(--r-player)"/>`);
 s+=`<rect x="${L}" y="${lane0}" width="${R-L}" height="${lane1-lane0}" fill="none" stroke="var(--line)"/>`;
 s+=`<line x1="${L}" y1="${Y(64)}" x2="${R}" y2="${Y(64)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
 const pts=[[0,64],[2.3,64],[2.9,127],[4.2,127],[4.6,64],[5.6,64],[5.9,72],[6.15,64],[6.4,72],[6.65,64],[6.9,72],[7.15,64],[7.4,72],[7.6,64],[8,64]];
 s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
 s+=`<circle cx="${X(4.6)}" cy="${Y(64)}" r="5" fill="var(--rec)"/>`;
 s+=`<text x="${L-6}" y="${Y(127)+4}" text-anchor="end">127</text><text x="${L-6}" y="${Y(64)+4}" text-anchor="end">64</text><text x="${L-6}" y="${Y(0)}" text-anchor="end">0</text>`;
 s+=`<text class="jps" x="${X(2.9)}" y="${Y(127)-6}">チョーキング</text><text class="jps" x="${X(4.75)}" y="${Y(64)+18}" style="fill:var(--rec)">64に戻す</text><text class="jps" x="${X(5.7)}" y="${Y(72)-8}">ビブラート</text><text class="jps" x="${L+4}" y="${lane0-6}">Pitch Bend</text>`;
 return `<figure class="fig" style="margin:0"><svg viewBox="0 0 640 ${lane1+12}" role="img" aria-label="ピッチベンドのカーブの例">${s}</svg><p class="fig-cap">上がノート、下がPitch Bendのレーン。点線の64が音程の変化なしです。模式図。</p></figure>`;
}
/* レガート:重ねない場合と重ねる場合 */
function legatoFig(){

  s+=`<rect x="${X(a[0])}" y="${y+28}" width="${X(a[1])-X(a[0])}" height="16" rx="2" fill="var(--r-audio)"/><rect x="${X(b[0])}" y="${y+8}" width="${X(b[1])-X(b[0])}" height="16" rx="2" fill="var(--r-audio)"/>`;
  if(over){s+=`<rect x="${X(b[0])}" y="${y+4}" width="${X(a[1])-X(b[0])}" height="44" fill="none" stroke="var(--rec)" stroke-width="2" stroke-dasharray="3 3"/><path d="M${X(a[1])-14} ${y+36} C ${X(a[1])+10} ${y+36}, ${X(b[0])+18} ${y+16}, ${X(b[0])+40} ${y+16}" fill="none" stroke="var(--rec)" stroke-width="2"/><text class="jps" x="${X(a[1])+12}" y="${y+66}" style="fill:var(--rec)">重なり → 弾き直さずにつながる</text>`}
  else s+=`<text class="jps" x="${X(a[1])+4}" y="${y+66}">すき間 → 弾き直す</text>`;
  return s};
 return `<figure class="fig" style="margin:0"><svg viewBox="0 0 640 186" role="img" aria-label="ノートを重ねる場合と重ねない場合の比較">${row(10,'重ねない','普通の発音',[0.2,1.8],[2.1,3.6],0)}${row(104,'少し重ねる','Legatoモード',[0.2,2.3],[2.0,3.6],1)}</svg><p class="fig-cap">音源をLegatoモードにしたとき。重なった部分でGlideが働きます。模式図。</p></figure>`;
}
/* ピアノロールの模式図。番号は下の手順リストと対応 */
function prollFig(){
 const L=150,T=28,R=640,rows=12,rh=14,B=T+rows*rh,bar=(R-L)/4;
 let k='',g='',n='',v='';
 const black=[1,3,6,8,10];
 for(let i=0;i<rows;i++){const y=T+i*rh,isB=black.includes(i);
  k+=`<rect x="110" y="${y}" width="40" height="${rh}" fill="var(--${isB?'lcd':'surface'})" stroke="var(--line)"/>`;
  g+=`<rect x="${L}" y="${y}" width="${R-L}" height="${rh}" fill="var(--${isB?'sunken':'surface'})"/>`}
 for(let i=0;i<=16;i++){const x=L+i*bar/4;g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${B}" stroke="var(--line)" stroke-width="${i%4?0.5:1.2}"/>`}
 const notes=[[0,8,1,.45],[1,6,1,.6],[2,4,1,.75],[3,3,1,.5],[4,5,2,.9],[6,6,1,.55],[7,8,1,.4],[8,3,1.5,.95],[10,4,1,.7],[11,6,1,.5],[12,8,3,.85],[15,6,1,.45]];
 notes.forEach(a=>{const x=L+a[0]*bar/4,y=T+a[1]*rh,c=a[3]>.7?'--r-player':a[3]>.5?'--r-pattern':'--r-audio';
  n+=`<rect x="${x+1}" y="${y+1}" width="${a[2]*bar/4-2}" height="${rh-2}" rx="2" fill="var(${c})"/>`;
  v+=`<line x1="${x+4}" y1="${B+50}" x2="${x+4}" y2="${B+50-a[3]*40}" stroke="var(${c})" stroke-width="3"/>`});
 const ruler=[1,2,3,4].map((b,i)=>`<text x="${L+i*bar+4}" y="18">${b}</text>`).join('');
 const dot=(x,y,t)=>`<circle class="num" cx="${x}" cy="${y}" r="10"/><text class="numt" x="${x}" y="${y+4.5}">${t}</text>`;
 return `<div class="fig"><svg viewBox="0 0 640 ${B+56}" role="img" aria-label="ピアノロールの画面構成の模式図"><rect width="640" height="${B+56}" fill="var(--surface)"/><rect x="0" y="0" width="110" height="${B+56}" fill="var(--sunken)"/><rect x="110" y="0" width="530" height="${T}" fill="var(--sunken)"/>${g}${k}${n}<line x1="110" y1="${B}" x2="640" y2="${B}" stroke="var(--line)"/>${v}${ruler}${dot(55,70,1)}${dot(130,20,2)}${dot(600,14,3)}${dot(360,T+rh*1.2,4)}${dot(125,B+30,5)}</svg></div>`;
}

/* ポップアップ */
function openPop(anchor,title,items,current,onPick){
 closePop();
 const back=document.createElement('div');back.className='pop-back';
 const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','listbox');pop.setAttribute('aria-label',title);
 pop.innerHTML=(items[0]&&items[0].head?'':`<h3>${esc(title)}</h3>`)+items.map(i=>i.head?`<h3>${esc(i.head)}</h3>`:`<button role="option" data-v="${esc(i.v)}" aria-selected="${i.sel!==undefined?i.sel:i.v===current}">${esc(i.l)}${i.s?`<small>${esc(i.s)}</small>`:''}</button>`).join('');
 document.body.append(back,pop);
 const r=anchor.getBoundingClientRect(),pw=pop.offsetWidth;
 pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pw-8))+'px';
 pop.style.top=Math.min(r.bottom+6,Math.max(8,innerHeight-pop.offsetHeight-8))+'px';
 const btns=[...pop.querySelectorAll('button')];
 (btns.find(b=>b.getAttribute('aria-selected')==='true')||btns[0]).focus();
 const finish=()=>{closePop();anchor.focus()};
 back.onclick=finish;
 pop.onclick=e=>{const b=e.target.closest('button');if(b){closePop();onPick(b.dataset.v)}};
 pop.onkeydown=e=>{const i=btns.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();finish()}
  else if(e.key==='ArrowDown'){e.preventDefault();btns[(i+1)%btns.length].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();btns[(i-1+btns.length)%btns.length].focus()}
  else if(e.key==='Tab'){e.preventDefault()}};
}

$('#q').addEventListener('input',e=>{const v=e.target.value.trim();v?searchView(v):route()});
view.addEventListener('click',e=>{const sy=e.target.closest('[data-say]');if(sy){const id=sy.dataset.say;if(speaking&&speaking.ids[speaking.i]===id)stopSpeak();else speakTopics([id]);return}
 const s=e.target.closest('[data-star]');if(s){const id=s.dataset.star;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save('lp-favs',favs);const on=favs.includes(id);s.setAttribute('aria-pressed',on);s.textContent=on?'★':'☆'}
 if(e.target.closest('[data-res]')){$('#q').value=''}});
view.addEventListener('change',e=>{const c=e.target.closest('[data-first]');if(c){const i=+c.dataset.first;done=c.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);save('lp-first',done);const y=scrollY;home();scrollTo(0,y);const el=document.getElementById('f'+i);if(el)el.focus()}});
/* 表示設定(文字の大きさ・読み上げ速度・声) */
const SIZES=[['90%','小さめ','90%'],['100%','標準','100%'],['115%','大きめ','115%'],['130%','大','130%'],['150%','特大','150%']];
const RATES=[['0.8','ゆっくり'],['1','ふつう'],['1.25','やや速い'],['1.5','速い']];
let fs=load('lp-fs','100%'),rate=load('lp-rate','1'),voiceName=load('lp-voice','');
function applyFs(){document.documentElement.style.setProperty('--fs',fs)}
applyFs();
function jaVoices(){if(!TTS)return[];return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang))}
$('#viewBtn').onclick=e=>{
 const btn=e.currentTarget;
 const items=[{v:'h-size',head:'文字の大きさ'},...SIZES.map(s=>({v:'fs:'+s[0],l:s[1],s:s[2],sel:fs===s[0]}))];
 if(TTS){items.push({v:'h-rate',head:'読み上げの速さ'},...RATES.map(r=>({v:'rate:'+r[0],l:r[1],s:'×'+r[0],sel:rate===r[0]})));
  const vs=jaVoices();if(vs.length>1){items.push({v:'h-voice',head:'声'},...vs.map(v=>({v:'voice:'+v.name,l:v.name,sel:voiceName===v.name||(!voiceName&&v===vs[0])})))}}
 else items.push({v:'h-no',head:'このブラウザは読み上げに対応していません'});
 openPop(btn,'表示と読み上げ',items,null,v=>{
  if(v.startsWith('fs:')){fs=v.slice(3);save('lp-fs',fs);applyFs()}
  else if(v.startsWith('rate:')){rate=v.slice(5);save('lp-rate',rate);if(speaking)restartCurrent()}
  else if(v.startsWith('voice:')){voiceName=v.slice(6);save('lp-voice',voiceName);if(speaking)restartCurrent()}
 });
};

/* 音声読み上げ(ブラウザ内蔵の音声合成) */
const KEYREAD={'⌘':'コマンド ','⌥':'オプション ','⇧':'シフト ','⌃':'コントロール ','⌫':'デリート','↩':'リターン','↑':'上矢印','↓':'下矢印','←':'左矢印','→':'右矢印','Space':'スペース','Esc':'エスケープ','Tab':'タブ','Return':'リターン','/':'スラッシュ',';':'セミコロン',',':'カンマ','.':'ピリオド'};
function keyToSpeech(k){let s=k;for(const[a,b]of Object.entries(KEYREAD))s=s.split(a).join(b);return ' '+s.trim()+' キー '}
function speakText(t){
 const P=x=>x.replace(/\[\[(.+?)\]\]/g,(m,k)=>keyToSpeech(k));
 const parts=[P(t.t)+'。',P(t.p)];
 if(t.rows)t.rows.forEach(r=>parts.push(r[0]+'。'+P(r[1])+'。'));
 if(t.n)t.n.forEach((x,i)=>parts.push((i+1)+'。'+P(x)+'。'));
 if(t.d)t.d.forEach(x=>parts.push(P(x)+'。'));
 if(t.tip)parts.push('注意とコツ。'+P(t.tip));
 return parts.join('\n').replace(/[「」]/g,'').replace(/:/g,'、').replace(/→/g,'から').replace(/\//g,'または').replace(/〜/g,'から').replace(/。。/g,'。');
}
/* 長い文はブラウザによって途中で止まるため、文ごとに区切って順に読む */
function chunks(s){return s.split(/(?<=[。\n])/).map(x=>x.trim()).filter(Boolean)}
let speaking=null;
function speakTopics(ids){
 if(!TTS)return;
 stopSpeak(true);
 const h=(location.hash||'').slice(1);
 speaking={ids,i:0,j:0,parts:[],paused:false,ch:topicById(ids[0]).ch.id};
 startTopic();
}
function startTopic(){
 const sp=speaking;if(!sp)return;
 if(sp.i>=sp.ids.length){stopSpeak();return}
 const t=topicById(sp.ids[sp.i]);sp.parts=chunks(speakText(t));sp.j=0;
 document.querySelectorAll('.topic.reading').forEach(n=>n.classList.remove('reading'));
 document.querySelectorAll('[data-say]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.say===t.id));
 const el=document.getElementById('t-'+t.id);
 if(el){el.classList.add('reading');if(sp.ids.length>1)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
 $('#playerTxt').innerHTML=`<i>${sp.ids.length>1?(sp.i+1)+'/'+sp.ids.length:'再生中'}</i>${esc(plain(t.t))}`;
 $('#player').hidden=false;document.body.classList.add('has-player');
 $('#pPause').textContent='一時停止';
 nextChunk();
}
function nextChunk(){
 const sp=speaking;if(!sp)return;
 if(sp.j>=sp.parts.length){sp.i++;startTopic();return}
 const u=new SpeechSynthesisUtterance(sp.parts[sp.j]);
 u.lang='ja-JP';u.rate=+rate;
 const vs=jaVoices(),v=vs.find(x=>x.name===voiceName)||vs[0];if(v)u.voice=v;
 u.onend=()=>{if(speaking===sp&&!sp.restart){sp.j++;nextChunk()}};
 u.onerror=e=>{if(speaking===sp&&e.error!=='interrupted'&&e.error!=='canceled'){sp.j++;nextChunk()}};
 speechSynthesis.speak(u);
}
function restartCurrent(){const sp=speaking;if(!sp)return;sp.restart=true;speechSynthesis.cancel();setTimeout(()=>{sp.restart=false;sp.paused=false;$('#pPause').textContent='一時停止';nextChunk()},60)}
function stopSpeak(keepBar){
 speaking=null;if(TTS)speechSynthesis.cancel();
 document.querySelectorAll('.topic.reading').forEach(n=>n.classList.remove('reading'));
 document.querySelectorAll('[data-say]').forEach(b=>b.setAttribute('aria-pressed','false'));
 if(!keepBar){$('#player').hidden=true;document.body.classList.remove('has-player')}
}
$('#pStop').onclick=()=>stopSpeak();
$('#pPause').onclick=()=>{const sp=speaking;if(!sp)return;
 if(sp.paused){sp.paused=false;$('#pPause').textContent='一時停止';restartCurrent()}
 else{sp.paused=true;sp.restart=true;speechSynthesis.cancel();$('#pPause').textContent='再開'}};
if(TTS&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',()=>{});
addEventListener('pagehide',()=>{if(TTS)speechSynthesis.cancel()});

addEventListener('hashchange',route);
route();
</script>

h+='</div>';ov.innerHTML=h;document.body.appendChild(ov);
